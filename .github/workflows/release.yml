name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run test

      - run: bun run build
        env:
          VITE_API_MOCK: 'on'

      - name: Tentukan apakah ada perubahan yang layak rilis
        id: changes
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log "$last..HEAD" --pretty=%s | grep -Eq '^(feat|fix|perf|refactor)(\(|:|!)|BREAKING CHANGE'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada commit feat/fix/perf/refactor sejak $last; rilis dilewati."
          fi

      - name: Konfigurasi git
        if: steps.changes.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main

      - name: Release
        if: steps.changes.outputs.release == 'true'
        run: bunx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
