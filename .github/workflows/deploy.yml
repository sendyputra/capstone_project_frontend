name: Deploy ke Firebase Hosting

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Live dan preview memakai API asli; mock hanya untuk tes lokal.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://103.157.26.40.sslip.io:8555/api' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run test
      - run: bun run check:styles
      - run: bun run check:tokens
      - run: bun run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nusantara-booking
          channelId: live
